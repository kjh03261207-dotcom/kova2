<h2>4. 코바의 발행과 유지</h2>
<h3>
<pre>
4-1) 코바의 발행과 유지는 가상정부가 관리하며 그 수는 
     매년말 기준 (기본회원수 * 100코바) 이다.

4-2) 기본회원은 생년 기준 100년간이며 101년째에 남은
     코바(잉여코바)가 있으면 가상정부의 소유가 된다.

4-3) 가상정부는 부가세,보유세,잉여코바로 1차 매년말 
     기준 (기본회원수 * 100코바) 를 유지하며,

4-4) 코바유지에 가감이 발생되면 2차 기본코바를 제외한
     코바수로 일정비율 가감하여 기준을 유지한다.
</pre>
</h3>
