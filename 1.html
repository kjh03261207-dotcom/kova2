<h2>1. 기본회원의 등록</h2>
<h3>
<pre>
1-1) 기본회원은 한국국민으로서 본인인증을 거쳐 한번 
     등록되며 기본자산을 무조건으로 가진다.

1-2) 등록은 본인인증코드,생년월일,전화번호 제공으로 
     등록, 유효기간은 생년으로 부터 100년 이다.

1-3) 기본회원은 100코바 (기본자산)를 받고 년 2코바를 
     누적 받아 (주기, 팔기)로 사용할 수 있다.

1-4) 기본회원의 최대 보유량은 일만(10,000)코바이며
     거래는 코코단위로 한다.

1-5) 기본회원의 기본코바에는 보유세가 없다.
</pre>
</h3>
